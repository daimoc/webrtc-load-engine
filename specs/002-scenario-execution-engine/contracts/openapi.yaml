openapi: 3.0.0
info:
  title: WebRTC Load Engine API
  version: "1.0.0"
  description: API for managing and orchestrating WebRTC load tests.

paths:
  /api/v1/scenarios:
    post:
      summary: Create a new load test scenario
      operationId: createScenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioRequest'
      responses:
        '201':
          description: Scenario created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioResponse'
        '400':
          description: Bad Request - Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /api/v1/scenarios/{id}/_execute:
    post:
      summary: Execute a load test scenario
      operationId: executeScenario
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the scenario to execute
          schema:
            type: string
      responses:
        '202':
          description: Scenario execution accepted
        '404':
          description: Scenario not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Scenario is already running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    ScenarioRequest:
      type: object
      required:
        - name
        - platform
        - test_plan
      properties:
        name:
          type: string
          example: "My First Load Test"
        platform:
          type: string
          example: "jitsi"
        test_plan:
          $ref: '#/components/schemas/TestPlan'

    TestPlan:
      type: object
      required:
        - participants
        - ramp_up_seconds
        - duration_seconds
      properties:
        participants:
          type: integer
          minimum: 1
          example: 100
        ramp_up_seconds:
          type: integer
          minimum: 0
          example: 60
        duration_seconds:
          type: integer
          minimum: 1
          example: 300
        platform_config:
          type: object
          additionalProperties: true
          description: >-
            Adapter-specific settings, validated when the scenario is executed.
            Schema per platform: specs/003-xmpp-signaling/contracts/configuration.yaml for jitsi.
          example:
            xmpp_domain: meet.jit.si
            room_name: LoadTestRoom
        media:
          $ref: '#/components/schemas/MediaConfig'

    MediaConfig:
      type: object
      description: >-
        What each bot sends (specs/004-synthetic-media). Platform-independent.
        When absent, bots only receive. Invalid values are rejected with 400.
      properties:
        profile:
          type: string
          enum: [receive_only, audio, audio_video]
          default: receive_only
          description: >-
            receive_only: no media sent. audio: one Opus stream.
            audio_video: one Opus stream and one VP8 stream (640x360, 30 fps,
            about 500 kbit/s), looped from content built into the engine.
        stall_timeout_seconds:
          type: integer
          minimum: 1
          default: 10
          description: >-
            A bot that has received a media kind and then receives nothing of
            it for this long, while its connection is up, counts one stall.
        max_received_streams:
          type: integer
          minimum: 0
          default: 0
          description: >-
            Maximum number of remote streams each bot receives per media
            kind (0: no cap). Extra streams are ignored by the bot; with a
            bridge channel (005) the bot also subscribes to its received
            streams only, so the server stops sending the others. When a
            received stream ends, the oldest waiting one takes its place.
      example:
        profile: audio_video
        stall_timeout_seconds: 10
        max_received_streams: 10

    ScenarioResponse:
      type: object
      properties:
        id:
          type: string
          example: "scenario-a1b2c3d4"
        status:
          type: string
          example: "created"

    Error:
      type: object
      properties:
        error:
          type: string
          example: "Invalid platform adapter: skype"
