openapi: 3.0.0
info:
  title: WebRTC Load Engine API
  version: "1.0.0"
  description: API for managing and orchestrating WebRTC load tests.

paths:
  /api/v1/scenarios:
    post:
      summary: Create a new load test scenario
      operationId: createScenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioRequest'
      responses:
        '201':
          description: Scenario created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioResponse'
        '400':
          description: Bad Request - Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /api/v1/scenarios/{id}/_execute:
    post:
      summary: Execute a load test scenario
      operationId: executeScenario
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the scenario to execute
          schema:
            type: string
      responses:
        '202':
          description: Scenario execution accepted
        '404':
          description: Scenario not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Scenario is already running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/scenarios/{id}/quality:
    get:
      summary: Quality summary of a scenario's last run (added by 006)
      operationId: getQuality
      description: >-
        Defined in specs/006-media-quality/contracts/quality-summary.yaml
        (plus latency_reason per kind, specs/008-livekit-platform/contracts/quality-summary-delta.yaml):
        200 with the QualitySummary, 404 for an unknown scenario, 409 (with
        the scenario status) before the first run ends or while it runs.
        Since 007 the summary also has the server and load_machine sections
        (CPU and memory of the media server's containers and of the
        engine), defined in
        specs/007-server-load-report/contracts/server-load-summary.yaml.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Summary of the last run (schema in 006 quality-summary.yaml)
        '404':
          description: Scenario not found
        '409':
          description: No summary yet

components:
  schemas:
    ScenarioRequest:
      type: object
      required:
        - name
        - platform
        - test_plan
      properties:
        name:
          type: string
          example: "My First Load Test"
        platform:
          type: string
          enum: [jitsi, livekit]
          description: >-
            Platform adapter (livekit: 008). Any other value is rejected
            with 400 "unsupported platform adapter: X".
          example: "jitsi"
        test_plan:
          $ref: '#/components/schemas/TestPlan'

    TestPlan:
      type: object
      required:
        - participants
        - ramp_up_seconds
        - duration_seconds
      properties:
        participants:
          type: integer
          minimum: 1
          example: 100
        ramp_up_seconds:
          type: integer
          minimum: 0
          example: 60
        duration_seconds:
          type: integer
          minimum: 1
          example: 300
        platform_config:
          type: object
          additionalProperties: true
          description: >-
            Adapter-specific settings. Schema per platform:
            specs/003-xmpp-signaling/contracts/configuration.yaml for jitsi
            (validated when the scenario is executed),
            specs/008-livekit-platform/contracts/livekit-config.yaml for
            livekit (validated when the scenario is created, with
            media.simulcast and media.requested_heights rejected). Secret
            keys (jitsi: jwt_app_secret, jwt; livekit: api_secret, token)
            are replaced by "[redacted]" in what the service returns and
            logs.
          example:
            xmpp_domain: meet.jit.si
            room_name: LoadTestRoom
        media:
          $ref: '#/components/schemas/MediaConfig'
        server_monitoring:
          type: object
          description: >-
            Local Docker containers of the media server to sample for CPU and
            memory during the run (007). Schema in
            specs/007-server-load-report/contracts/test-plan-server.yaml.
          example:
            containers: [docker-jitsi-meet-jvb-1, docker-jitsi-meet-jicofo-1]
            interval_seconds: 5

    MediaConfig:
      type: object
      description: >-
        What each bot sends (specs/004-synthetic-media). Platform-independent.
        When absent, bots only receive. Invalid values are rejected with 400.
      properties:
        profile:
          type: string
          enum: [receive_only, audio, audio_video]
          default: receive_only
          description: >-
            receive_only: no media sent. audio: one Opus stream.
            audio_video: one Opus stream and one VP8 stream (640x360, 30 fps,
            about 500 kbit/s), looped from content built into the engine.
        stall_timeout_seconds:
          type: integer
          minimum: 1
          default: 10
          description: >-
            A bot that has received a media kind and then receives nothing of
            it for this long, while its connection is up, counts one stall.
        max_received_streams:
          type: integer
          minimum: 0
          default: 0
          description: >-
            Maximum number of remote streams each bot receives per media
            kind (0: no cap). Extra streams are ignored by the bot; with a
            bridge channel (005) the bot also subscribes to its received
            streams only, so the server stops sending the others. When a
            received stream ends, the oldest waiting one takes its place.
        source_file:
          type: string
          description: >-
            Path, on the engine's host, of a media file (any format ffmpeg
            reads) that the bots send instead of the built-in content: its
            first audio stream and, with audio_video, its first video stream.
            Needs profile audio or audio_video. When the scenario starts, the
            engine transcodes it with ffmpeg (which must be in its PATH) with
            the built-in content's parameters: Opus 48 kHz mono in 20 ms
            packets, 32 kbit/s; VP8 at 30 fps with a keyframe every 30
            frames, 640x360 at 500 kbit/s, or the simulcast layers. The
            picture is scaled to fit 16:9 and padded. The transcoded content
            is kept in memory for the process (about 63 kB per second of
            video at 360 lines), while the file's size and modification time
            stay the same. If the file cannot be transcoded, the scenario
            fails.
      example:
        profile: audio_video
        stall_timeout_seconds: 10
        max_received_streams: 10

    ScenarioResponse:
      type: object
      properties:
        id:
          type: string
          example: "scenario-a1b2c3d4"
        status:
          type: string
          example: "created"
        report:
          description: >
            Report files of the last run (feature 009,
            specs/009-run-report-files/contracts/api-scenario-report.yaml).
            Absent before the first run's report is written and while a run
            is running.
          $ref: '#/components/schemas/ReportFiles'

    ReportFiles:
      type: object
      required: [run_id, json, markdown]
      properties:
        run_id:
          type: string
          pattern: '^[0-9a-f]{8}$'
          example: "3f9a1c2e"
        json:
          $ref: '#/components/schemas/ReportFile'
        markdown:
          $ref: '#/components/schemas/ReportFile'

    ReportFile:
      type: object
      description: Exactly one of path and error is set.
      properties:
        path:
          type: string
          description: Absolute path of the written file.
          example: "/home/op/webrtc-load-engine/reports/20261018T153012Z-jitsi-ten-bots-3f9a1c2e.json"
        error:
          type: string
          description: Why the file was not written.

    Error:
      type: object
      properties:
        error:
          type: string
          example: "Invalid platform adapter: skype"
