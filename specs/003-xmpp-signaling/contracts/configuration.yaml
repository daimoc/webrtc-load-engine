# Jitsi Platform Adapter Configuration
# This defines the structure expected in the TestPlan.PlatformConfig map for Jitsi.

type: object
required:
  - xmpp_domain
  - room_name
properties:
  xmpp_domain:
    type: string
    description: "The XMPP server domain (e.g., meet.jit.si)"
    example: "meet.jit.si"
  muc_domain:
    type: string
    description: "The MUC component subdomain. Defaults to 'conference.<xmpp_domain>' if not provided."
    example: "conference.meet.jit.si"
  room_name:
    type: string
    description: "The target conference room name"
    example: "LoadTestRoom"
  websocket_url:
    type: string
    description: "Override for WebSocket URL. If empty, derived from xmpp_domain."
    example: "wss://meet.jit.si/xmpp-websocket"
  focus_jid:
    type: string
    description: "JID of the Jicofo focus component that receives the conference request. Defaults to 'focus.<xmpp_domain>' if not provided."
    example: "focus.meet.jit.si"
  connect_timeout:
    type: string
    description: "Go duration bounding the whole join (WebSocket dial, SASL, conference request, MUC join). Must be positive."
    default: "10s"
    example: "10s"
  keepalive_interval:
    type: string
    description: "Go duration between XEP-0199 pings to the server. An unanswered ping marks the peer's signaling as lost. Must be positive."
    default: "30s"
    example: "30s"
  debug:
    type: boolean
    description: "Log all XMPP stanzas to stdout (colour-coded; the CLI's --log-xmpp flag sets it)"
    default: false
  no_bridge_channel:
    type: boolean
    description: "Do not open the bridge channel the media server offers, so the bots send no receive preferences (no video requested, no audio subscription; the receive cap is enforced by the bots only). For comparison runs against the behavior before feature 005."
    default: false
  jwt:
    type: string
    description: "Ready-made JWT shared by all bots, for deployments using token authentication (Prosody mod_auth_token). Sent as the 'token' query parameter of the WebSocket URL (with 'room'); the client still authenticates with SASL ANONYMOUS. Mutually exclusive with jwt_app_id/jwt_app_secret."
  jwt_app_id:
    type: string
    description: "App id (iss claim). With jwt_app_secret, each bot signs its own HS256 token, with the bot's peer ID as context.user.id."
  jwt_app_secret:
    type: string
    description: "HS256 secret shared with Prosody (app_secret). Must be set with jwt_app_id. Never logged."
  jwt_audience:
    type: string
    description: "aud claim of the signed tokens"
    default: "jitsi"
  jwt_subject:
    type: string
    description: "sub claim of the signed tokens. Defaults to xmpp_domain."
  jwt_ttl:
    type: string
    description: "Go duration from issue to expiry (exp) of the signed tokens. Must be positive."
    default: "1h"
  jwt_moderator:
    type: boolean
    description: "Set context.user.moderator in the signed tokens"
    default: false
