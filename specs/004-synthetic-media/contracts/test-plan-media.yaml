# Addition to the TestPlan schema of
# specs/002-scenario-execution-engine/contracts/openapi.yaml
# (components.schemas.TestPlan.properties.media).
components:
  schemas:
    TestPlan:
      properties:
        media:
          $ref: '#/components/schemas/MediaConfig'

    MediaConfig:
      type: object
      description: >-
        What each bot sends. Platform-independent. When absent, bots only
        receive (behavior before feature 004).
      properties:
        profile:
          type: string
          enum: [receive_only, audio, audio_video]
          default: receive_only
          description: >-
            receive_only: no media sent. audio: one Opus stream.
            audio_video: one Opus stream and one VP8 stream (640x360, 30 fps,
            about 500 kbit/s), looped from content built into the engine.
        stall_timeout_seconds:
          type: integer
          minimum: 1
          default: 10
          description: >-
            A bot that has received a media kind and then receives nothing of
            it for this long, while its connection is up, counts one stall.
        max_received_streams:
          type: integer
          minimum: 0
          default: 0
          description: >-
            Maximum number of remote streams each bot receives per media
            kind (0: no cap). Extra streams are ignored by the bot; with a
            bridge channel (005) the bot also subscribes to its received
            streams only, so the server stops sending the others. When a
            received stream ends, the oldest waiting one takes its place.
        # simulcast and requested_heights: added by 006, defined in
        # specs/006-media-quality/contracts/test-plan-quality.yaml.
        source_file:
          type: string
          description: >-
            Path, on the engine's host, of a media file (any format ffmpeg
            reads) that the bots send instead of the built-in content: its
            first audio stream and, with audio_video, its first video stream.
            Needs profile audio or audio_video. When the scenario starts, the
            engine transcodes it with ffmpeg (which must be in its PATH) with
            the built-in content's parameters: Opus 48 kHz mono in 20 ms
            packets, 32 kbit/s; VP8 at 30 fps with a keyframe every 30
            frames, 640x360 at 500 kbit/s, or the simulcast layers. The
            picture is scaled to fit 16:9 and padded. The transcoded content
            is kept in memory for the process (about 63 kB per second of
            video at 360 lines), while the file's size and modification time
            stay the same. If the file cannot be transcoded, the scenario
            fails.
      example:
        profile: audio_video
        stall_timeout_seconds: 10
        max_received_streams: 10

# Errors: POST /api/v1/scenarios returns 400 with an error message when
# media.profile is not one of the values above, stall_timeout_seconds < 1,
# max_received_streams < 0, or source_file is set with profile receive_only
# or is not a readable regular file.
