# Local LiveKit server for 008 (specs/008-livekit-platform/research.md R12).
# Keys and node IP come from .env (copy env.example; .env is not committed).
services:
  livekit:
    image: livekit/livekit-server:v1.13.10
    container_name: livekit-server
    network_mode: host
    command: --config /etc/livekit.yaml --node-ip ${LIVEKIT_NODE_IP:-127.0.0.1}
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    restart: unless-stopped
