# Single-node LiveKit, no Redis. Ports do not collide with docker-jitsi-meet.
port: 7880            # signaling (WebSocket /rtc) and HTTP API
rtc:
  tcp_port: 7881      # ICE/TCP fallback
  # ICE/UDP: one port per PeerConnection. The single-port mux (udp_port)
  # queues downstream media at 100 bots on one machine (1.3 s audio
  # latency, MOS 1.5; specs/008-livekit-platform/tasks.md T027).
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: false
room:
  empty_timeout: 30   # seconds an empty room is kept
logging:
  level: info
